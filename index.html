<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dcebf5">
  <title>HappyCat · 選擇體驗</title>
  <link rel="stylesheet" href="./portal.css">
</head>
<body>
  <main class="portal">
    <header class="intro">
      <p class="eyebrow">HappyCat</p>
      <h1>今天想怎麼和小貓散步？</h1>
      <p>選擇視角，開始探索地圖上的小貓。</p>
    </header>

    <nav class="versions" aria-label="選擇 HappyCat 版本">
      <a class="version" href="./v1/">
        <span class="version-number">V1</span>
        <span class="version-title">小貓散步</span>
        <span class="version-description">在地圖上操控小貓，切換第一人稱與第三人稱視角。</span>
        <span class="version-action">進入小貓散步 <span aria-hidden="true">→</span></span>
      </a>

      <a class="version" href="./v2/">
        <span class="version-number">V2</span>
        <span class="version-title">第一人稱預覽</span>
        <span class="version-description">從自己的視線看地圖，使用手機方向與定位，召喚小貓到眼前。</span>
        <span class="version-action">進入第一人稱預覽 <span aria-hidden="true">→</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
