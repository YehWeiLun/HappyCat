<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fb4ec">
<title>HappyCat · 小貓散步</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.1/dist/maplibre-gl.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","maplibre-gl":"https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.1/dist/maplibre-gl.mjs"}}</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="map"></div>
<div id="crosshair" hidden></div>

<section id="hud" class="panel">
  <h1>🐈 小貓散步</h1>
  <dl id="status">
    <dt>動作</dt><dd id="st-state">—</dd>
    <dt>步伐</dt><dd id="st-gait">走路</dd>
    <dt>視角</dt><dd id="st-view">第三人稱</dd>
    <dt>速度</dt><dd id="st-speed">0.0 m/s</dd>
  </dl>
  <ul class="keys desktop-only">
    <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動（依鏡頭方向）</li>
    <li><kbd>R</kbd> 切換走路／跑步</li>
    <li><kbd>Space</kbd> 跳躍</li>
    <li><kbd>Ctrl</kbd> 趴下休息／起身</li>
    <li><kbd>Tab</kbd> 第一／第三人稱</li>
    <li><kbd>M</kbd> 切換底圖 · <kbd>B</kbd> 建物框</li>
    <li>滑鼠：轉向與仰角 · 滾輪：鏡頭遠近</li>
  </ul>
  <button id="reset">回到起點</button>
</section>

<button id="map-layer-toggle" class="panel" type="button" aria-expanded="false" aria-controls="map-layers">🗺️ 圖層</button>
<section id="map-layers" class="panel" aria-label="地圖圖層" hidden>
  <h2>地圖圖層</h2>
  <select id="base-map" aria-label="底圖">
    <option value="streets">街道地圖</option>
    <option value="emap">臺灣通用電子地圖</option>
    <option value="photo" selected>正射影像</option>
  </select>
  <label><input id="building-frames" type="checkbox" checked>分棟建物框</label>
  <small>測繪中心圖資範圍以臺灣為主；影像與建物框依供應區域顯示。</small>
  <a class="home-link" href="../">返回版本選擇</a>
</section>

<div id="stick" class="panel touch-only" aria-label="移動搖桿"><div id="knob"></div></div>
<div id="pad" class="panel" aria-label="動作按鈕">
  <button id="btn-view">視角</button>
  <button id="btn-lie">趴下</button>
  <button id="btn-run">跑步</button>
  <button id="btn-jump">跳</button>
</div>

<div id="lock-hint" class="panel desktop-only" hidden>點一下畫面鎖定滑鼠，Esc 釋放</div>
<div id="error" class="panel" role="alert" hidden></div>

<div id="overlay">
  <div class="card panel">
    <h2>小貓散步</h2>
    <p id="overlay-msg">載入模型與地圖中…</p>
    <button id="start" disabled>開始</button>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
