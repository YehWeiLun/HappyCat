<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fb4ec">
<title>HappyCat V3 · 透天厝探索</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="../assets/v3/style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div id="crosshair" hidden></div>

<section id="hud" class="panel">
  <h1>🐈 V3 · 透天厝探索</h1>
  <dl id="status">
    <dt>動作</dt><dd id="st-state">—</dd>
    <dt>步伐</dt><dd id="st-gait">走路</dd>
    <dt>視角</dt><dd id="st-view">第三人稱</dd>
    <dt>速度</dt><dd id="st-speed">0.0 m/s</dd>
    <dt>位置</dt><dd id="st-floor">庭院</dd>
    <dt>貓咪</dt><dd id="st-cat">—</dd>
  </dl>
  <ul class="keys desktop-only">
    <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動（依鏡頭方向）</li>
    <li><kbd>R</kbd> 切換走路／跑步</li>
    <li><kbd>Space</kbd> 跳躍</li>
    <li><kbd>Ctrl</kbd> 趴下休息／起身</li>
    <li><kbd>Tab</kbd> 第一／第三人稱</li>
    <li><kbd>C</kbd> 切換貓咪（細臉版／短頸版）</li>
    <li>滑鼠：轉向與仰角 · 滾輪：鏡頭遠近</li>
  </ul>
  <div class="hud-buttons"><button id="reset">回到門前</button><button id="swap-cat">換貓咪</button></div>
  <p class="house-help">從正門進入，沿中央樓梯上下樓。室內可用 Tab／視角按鈕切換第一人稱。</p>
  <a class="home-link" href="../">返回版本選擇</a>
</section>

<div id="stick" class="panel touch-only" aria-label="移動搖桿"><div id="knob"></div></div>
<div id="pad" class="panel" aria-label="動作按鈕">
  <button id="btn-view">視角</button>
  <button id="btn-lie">趴下</button>
  <button id="btn-run">跑步</button>
  <button id="btn-jump">跳</button>
</div>

<div id="lock-hint" class="panel desktop-only" hidden>點一下畫面鎖定滑鼠，Esc 釋放</div>
<div id="error" class="panel" role="alert" hidden></div>

<div id="overlay">
  <div class="card panel">
    <h2>V3 · 透天厝探索</h2>
    <p id="overlay-msg">載入模型中…</p>
    <button id="start" disabled>開始</button>
  </div>
</div>

<script type="module" src="../assets/v3/app.js"></script>
</body>
</html>
